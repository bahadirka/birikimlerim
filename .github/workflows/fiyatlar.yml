name: Fiyatlar
on:
  schedule:
    - cron: "7,37 6-16 * * 1-5"   # hafta içi 09:07–19:37 (TR) yarım saatte bir
    - cron: "17 19 * * 1-5"       # akşam: TEFAS günlük fiyatları
    - cron: "23 6,12,18 * * 0,6"  # hafta sonu: haberler
    - cron: "17 6 * * *"           # her gün 09:17 (TR): 09:45 özetinden önce b4thenews
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/fiyatlar.yml"]
permissions:
  contents: write
concurrency:
  group: fiyatlar
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance requests youtube-transcript-api
      - run: python scripts/fiyatlar.py /tmp/prices.json /tmp/grafik
      - name: önceki yayını al (haber/analiz önbelleği)
        run: git clone -q --depth 1 -b fiyatlar "https://github.com/${{ github.repository }}.git" /tmp/onceki || mkdir -p /tmp/onceki
      - name: durum, enflasyon, haberler
        run: python scripts/analiz.py /tmp/ek /tmp/onceki || true
      - name: Burak Arslan (b4thenews) yayınları
        run: python scripts/b4.py /tmp/ek/b4.json /tmp/onceki/b4.json || true
      - name: fiyatlar dalına yaz
        run: |
          cd /tmp && rm -rf yayin && mkdir yayin && cd yayin
          git init -q -b fiyatlar
          cp /tmp/prices.json .
          cp -r /tmp/grafik . || true
          cp /tmp/fon_getiri.json . || true
          cp /tmp/ek/analiz.json . || true
          cp -r /tmp/ek/haber . || true
          cp /tmp/ek/b4.json . || true
          git config user.name "fiyat-botu"
          git config user.email "fiyat-botu@users.noreply.github.com"
          git add -A
          git commit -qm "fiyatlar $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fiyatlar
