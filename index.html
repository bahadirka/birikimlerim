<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--muted:#6b6b70;--line:#e6e4df;--acc:#a87b06;--pos:#2b8a3e;--neg:#c92a2a}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1e;--fg:#f2f2f2;--muted:#9a9aa0;--line:#2c2c2e;--acc:#e0b84a;--pos:#51cf66;--neg:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.r{text-align:right;white-space:nowrap}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg)}
main a{color:var(--acc)}
.iconbtn.on{border-color:var(--acc);color:var(--acc)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--fg);font:inherit;font-size:13px;margin-left:6px;cursor:pointer}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.chip b{display:block;font-size:15px}
.chip.up{background:color-mix(in srgb,var(--pos) 9%,var(--card));border-color:color-mix(in srgb,var(--pos) 35%,var(--line))}
.chip.down{background:color-mix(in srgb,var(--neg) 9%,var(--card));border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.chg{font-size:12px;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.chg .up,.tick.up{color:var(--pos);font-weight:600}.chg .down,.tick.down{color:var(--neg);font-weight:600}
.tick{font-size:11px}
.iz-ust{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.iz-ara{margin-bottom:10px}
.iz-cipler{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.iz-cipler::-webkit-scrollbar{display:none}
.iz-cipler button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.iz-cipler button.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.iz-kart{padding:0 12px}
.iz-satir{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.iz-satir:last-child{border-bottom:0}
.iz-satir{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;background:var(--card)}

.iz-yildiz.on{color:var(--acc)}

.iz-ad{flex:1;min-width:0}
.iz-ad b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iz-ad small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iz-fiyat{font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.iz-ch{width:68px;text-align:right;font-weight:600;font-size:14px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.seg .segon{background:var(--acc);color:#fff;font-weight:600}

.mk{cursor:pointer}
.gp{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}

.gp-kart{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.nb{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.nb-bas{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.nb-puan{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:-2px}
.nb-puan small{display:block;font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:600}
.nb-evre{border-left:3px solid;padding:6px 0 6px 12px;margin-top:6px;font-size:14px}
.nb-ad{font-size:22px;font-weight:800;margin:2px 0}
.nb-k{font-size:10px;letter-spacing:.6px;text-transform:uppercase}

.nb-cubuk{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.nb-cubuk span{flex:1 0 auto;font-size:10px;text-align:center;padding:5px 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.nb-cubuk span::before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--r);margin:0 auto 3px}
.nb-cubuk span.on{border-color:var(--r);color:var(--fg);font-weight:700}
@media (min-width:600px){.gp-kart{border-radius:18px}}
.gp-ust{display:flex;align-items:center;gap:8px}
.gp-fiyat{font-size:26px;font-weight:700;margin-top:10px;letter-spacing:-.4px}
.gp-alt{font-size:13px;min-height:18px;margin-bottom:8px}

.mkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.mk{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 10px 14px;min-height:104px}
.mk .spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:44%;pointer-events:none}
.mk-ust{position:relative;display:flex;align-items:flex-start;gap:6px}
.mk-ik{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10.5px;letter-spacing:-.4px}
.mk-ad{flex:1;min-width:0;font-weight:600;font-size:13px;line-height:1.15;overflow-wrap:break-word}
.mk-ad small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:1px}
.mk-pill{flex:none;display:flex;align-items:center;border-radius:9px;padding:3px 5px;font-size:11.5px;font-weight:700;background:var(--bg);color:var(--muted);line-height:1.2}
.mk-pill small{font-size:10px;font-weight:500;color:var(--muted)}
.mk-pill.up{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.mk-pill.down{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.mk-fiyat{position:relative;font-size:19px;font-weight:700;margin-top:10px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-anlik{position:relative;font-size:11px;font-weight:600;margin-top:2px}
.mk-anlik.up{color:var(--pos)}.mk-anlik.down{color:var(--neg)}
@keyframes fu{0%{box-shadow:0 0 0 2px var(--pos)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fd{0%{box-shadow:0 0 0 2px var(--neg)}100%{box-shadow:0 0 0 0 transparent}}
.flash-up{animation:fu 1.6s ease-out 2}.flash-down{animation:fd 1.6s ease-out 2}
@media (prefers-reduced-motion:reduce){.flash-up,.flash-down{animation:none}}

.warn{background:rgba(201,42,42,.08);border:1px solid var(--neg);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--fg)}
.check input{width:auto;margin-top:3px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:10}
.center{max-width:420px;margin:8vh auto 0}
.err{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
svg{width:100%;height:auto;display:block}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:4px}
</style>

/* ============ Şifreleme (cihazda, AES-256-GCM + PBKDF2) ============ */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const a = new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let anahtarHam = null; // kasa açıkken bellekte; Face ID kaydı için gerekir
async function anahtarUret(parola, salt){
  // deriveBits(256) = deriveKey(AES-256) ile aynı anahtar; eski kasalar aynen açılır
  const base = await crypto.subtle.importKey("raw", te.encode(parola), "PBKDF2", false, ["deriveBits"]);
  anahtarHam = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, 256));
  return crypto.subtle.importKey("raw", anahtarHam, "AES-GCM", false, ["encrypt","decrypt"]);
}

/* ============ Face ID ile açma (WebAuthn PRF) ============
   Face ID'nin ürettiği gizli değer, kasa anahtarını SADECE bu cihazda sarar.

const fidAnahtar = () => "faceid:" + kasaId;
function fidKayit(){ try { return JSON.parse(lsGet(fidAnahtar()) || "null"); } catch { return null; } }

const fidHazir = () => { const r = fidKayit(); return !!(r && r.ct && kasaDoc && r.salt === kasaDoc.salt); };
function fidSil(){ try { localStorage.removeItem(fidAnahtar()); } catch {} }
async function prfAl(cid, ps){
  const cred = await navigator.credentials.get({publicKey:{challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname,
    allowCredentials:[{type:"public-key", id: cid}], userVerification:"required", timeout:60000, extensions:{prf:{eval:{first: ps}}}}});
  const r = cred.getClientExtensionResults()?.prf?.results?.first;
  if (!r) throw new Error("prf-yok");
  return new Uint8Array(r);
}
async function fidSar(prf){
  const k = await crypto.subtle.importKey("raw", prf, "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, anahtarHam);
  const r = fidKayit() || {};
  lsSet(fidAnahtar(), JSON.stringify({...r, iv:b64(iv), ct:b64(ct), salt:kasaDoc.salt}));
}
async function faceIdEtkinlestir(){
  if (!anahtarHam) throw new Error("kilitli");
  const ps = crypto.getRandomValues(new Uint8Array(32));

    rp:{name:"Birikimlerim", id: location.hostname},
    user:{id: crypto.getRandomValues(new Uint8Array(16)), name: benEmail || "birikimlerim", displayName: "Birikimlerim kasası"},
    challenge: crypto.getRandomValues(new Uint8Array(32)),

    authenticatorSelection:{authenticatorAttachment:"platform", residentKey:"preferred", userVerification:"required"},
    timeout:60000, extensions:{prf:{eval:{first: ps}}}}});
  const ext = cred.getClientExtensionResults()?.prf;
  if (ext && ext.enabled === false) throw new Error("prf-yok");
  lsSet(fidAnahtar(), JSON.stringify({cid:b64(cred.rawId), ps:b64(ps)}));
  if (ext?.results?.first) { await fidSar(new Uint8Array(ext.results.first)); return true; }
  return false; // iOS bazen ilk adımda değeri vermez → "Doğrula" ile ikinci dokunuş
}
async function faceIdDogrula(){

function fidHata(e){
  if (e?.message === "prf-yok") return "Bu cihaz Face ID ile kasa açmayı desteklemiyor (iPhone'da iOS 18 veya üstü ve Safari gerekir).";
  if (e?.name === "NotAllowedError" || e?.name === "AbortError") return "Face ID iptal edildi ya da süresi doldu. Tekrar deneyin.";
  if (e?.name === "InvalidStateError") return "Bu cihazda zaten bir Face ID kaydı var. Tekrar deneyin.";

async function sifrele(key, obj){

/* Vadeli mevduat: faiz = anapara × yıllık oran × gün / 365, net = brüt × (1 − stopaj) */

function mevduatHesap(a){

  const gunToplam = (bas && vade) ? Math.max(0, Math.round((vade-bas)/GUN)) : 0;
  const gecen = bas ? Math.min(gunToplam, Math.max(0, Math.round((bugunD-bas)/GUN))) : 0;
  const kalan = vade ? Math.round((vade-bugunD)/GUN) : null;
  const brut = ana * oran/100 * gunToplam/365, netHesapla = brut * (1 - stopaj/100);
  const elle = sayi(a.vadeTutar);

  const netFaiz = vadeSonu - ana;
  const simdi = gunToplam ? ana + netFaiz * gecen/gunToplam : ana;
  return {ana, oran, stopaj, gunToplam, gecen, kalan, brut, netFaiz, vadeSonu, simdi, elle: elle!=null};

const ort = (v, n) => v.length>=n ? v.slice(-n).reduce((a,b)=>a+b,0)/n : null;

/* Her aralık kendi verisiyle: Yıl = 50/200 günlük; Ay = 5/20 günlük; Hafta ve Gün = dönemin 1/5'i ve tamamı */
const NABIZ_AYAR = {
  yil:  {ad:"Yıllık görünüm", kisa:50, uzun:200, kAd:"50G ort.", uAd:"200G ort.", zAd:"1 yıllık zirve", o1:4, o2:8},

  gun:  {ad:"Gün içi görünüm", kisa:null, uzun:null, kAd:"Son saatler ort.", uAd:"Gün içi ort.", zAd:"Gün içi zirve", o1:0.3, o2:0.6},

function nabizHesapla(v, guncel, mod="yil"){
  const A = NABIZ_AYAR[mod];
  if (!v || v.length < (mod==="yil"?60:12)) return null;
  v = v.slice(); if (guncel && isFinite(guncel) && (mod==="yil"||mod==="ay")) v.push(guncel);
  const n = v.length, kisa = A.kisa || Math.max(3, Math.round(n/5)), uzun = Math.min(A.uzun || n, n);
  const p = v[n-1], m50 = ort(v, Math.min(kisa, n)), m200 = ort(v, uzun);
  const rPer = Math.min(14, n-2), r = (()=>{ let k=0,z=0; for (let i=n-rPer;i<n;i++){ const d=v[i]-v[i-1]; if (d>0) k+=d; else z-=d; } return z===0 ? 100 : 100-100/(1+k/z); })();

  const parca = [r, aralik, sig(u50, A.o1), sig(u200, A.o2)];

  return {mod, A, puan, evre, trend, p, m50, m200, r, yuk, dus, aralik, u50, u200, zirve:(p/yuk-1)*100, kisa: mod==="yil" && n<200};

let izSur = null, izTikEngel = 0;
const izSiralanabilir = () => tab==="izle" && izGrup==="fav" && !izAra.trim();
function izSurBasla(row, y){
  izSur = {row, y0:y, kayma:0, aktif:false, zaman: setTimeout(()=>{
    if (!izSur) return; izSur.aktif = true; row.classList.add("surukle"); try { navigator.vibrate?.(12); } catch {}
  }, 380)};
}
function izSurHareket(y, e){
  if (!izSur) return;
  if (!izSur.aktif){ if (Math.abs(y-izSur.y0) > 8){ clearTimeout(izSur.zaman); izSur = null; } return; }
  e?.preventDefault?.();
  const row = izSur.row;
  let dy = y - izSur.y0 - izSur.kayma;
  const sonraki = row.nextElementSibling, onceki = row.previousElementSibling;
  if (dy > 0 && sonraki && dy > sonraki.offsetHeight/2){ row.parentNode.insertBefore(sonraki, row); izSur.kayma += sonraki.offsetHeight; dy -= sonraki.offsetHeight; }
  else if (dy < 0 && onceki && -dy > onceki.offsetHeight/2){ row.parentNode.insertBefore(row, onceki); izSur.kayma -= onceki.offsetHeight; dy += onceki.offsetHeight; }
  row.style.transform = `translateY(${dy}px)`;
}
function izSurBitir(){
  if (!izSur) return;

  if (izSur.aktif){
    const row = izSur.row; row.classList.remove("surukle"); row.style.transform = "";

/* ============ Sanal işlem (paper trading) — gerçek para yok ============
   Kurallar uygulama açıkken ve fiyatlar yenilendikçe kontrol edilir (dakikada bir). */
const SN_BAS = {TRY:1000000, USD:20000};
function snPB(k){
  if (k.startsWith("b:") || ["gram24","ceyrek","gumus","USD","EUR","GBP"].includes(k)) return "TRY";
  if (k.startsWith("a:") || k.startsWith("c:") || ["ONS","AGONS","BRENT","EURUSD","btc"].includes(k)) return "USD";
  return null;
}
const sanalIslenebilir = k => !!snPB(k) && !k.startsWith("f:");
function snHazir(){ if (!S.sanal) S.sanal = {bas:{...SN_BAS}, nakit:{...SN_BAS}, poz:{}, emir:[], gecmis:[]}; return S.sanal; }
const snF = pb => pb==="USD" ? fUSD2 : fTL2n;
const fAdet = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:6});
const snAd = k => izBul(k)?.l || k;
function snFiyat(k){ const o = izBul(k); return (o && o.v>0) ? o.v : null; }
function snIslem(k, yon, adet, fiyat, neden){
  const sn = snHazir(), pb = snPB(k); adet = +adet;
  if (!pb || !(adet>0) || !(fiyat>0)) return "Geçersiz işlem";
  const tutar = adet*fiyat, poz = sn.poz[k] || {adet:0, ort:0, pb};
  if (yon==="al"){
    if (sn.nakit[pb] < tutar - 1e-9) return `Yetersiz sanal ${pb==="USD"?"dolar":"TL"} bakiye`;
    sn.nakit[pb] -= tutar; poz.ort = (poz.ort*poz.adet + tutar)/(poz.adet+adet); poz.adet += adet; poz.pb = pb; sn.poz[k] = poz;
  } else {
    if (poz.adet < adet - 1e-9) return "Elinizde bu kadar yok";
    sn.nakit[pb] += tutar; const kz = (fiyat-poz.ort)*adet; poz.adet -= adet;
    if (poz.adet < 1e-9) delete sn.poz[k]; else sn.poz[k] = poz;
    sn.gecmis.unshift({t:Date.now(), k, yon, adet, fiyat, pb, kz, neden}); kaydet(true); return null;
  }
  sn.gecmis.unshift({t:Date.now(), k, yon, adet, fiyat, pb, neden}); if (sn.gecmis.length>300) sn.gecmis.length=300;
  kaydet(true); return null;
}
function sanalKontrol(){
  const sn = S?.sanal; if (!sn || demo && !sn) return;
  if ([...sn.emir.map(e=>e.k), ...Object.keys(sn.poz)].some(k=>k.startsWith("c:"))) kriptoAl();
  let oldu = [];
  for (const e of sn.emir.filter(e=>e.durum==="bekliyor")){
    const p = snFiyat(e.k); if (!p) continue;
    if ((e.kosul==="ustune" && p>=e.fiyat) || (e.kosul==="altina" && p<=e.fiyat)){
      let adet = e.tutar ? e.tutar/p : e.adet; if (e.k.startsWith("b:")) adet = Math.floor(adet);

function kivilcim(seri, yon){

  const pts = seri.map((v,i)=>[(i/(seri.length-1))*W, H-4-((v-mn)/rg)*(H-10)]);

  const renk = yon<0 ? "var(--neg)" : yon>0 ? "var(--pos)" : "var(--muted)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${W},${H} L0,${H} Z" fill="${renk}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${renk}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".55"/></svg>`;
}

/* Dilim grafik: kategoriye dokununca Varlıklar o kategoriyle açılır */
function pasta(grup, top){
  const dil = PASTA_SIRA.filter(k=>grup[k]>0).map(k=>({k, v:grup[k], o:grup[k]/top}));
  const R=92, r=58, C=100;
  const nokta = (a,rad)=>[C+rad*Math.sin(a), C-rad*Math.cos(a)];
  let a0 = 0, yollar = "";
  for (const d of dil){
    const a1 = a0 + d.o*2*Math.PI;
    if (dil.length===1){
      yollar += `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${renkOf(d.k)}" stroke-width="${R-r}" data-kat="${d.k}" style="cursor:pointer"><title>${TYPES[d.k].ad}</title></circle>`;
    } else {
      const [x0,y0]=nokta(a0,R),[x1,y1]=nokta(a1,R),[x2,y2]=nokta(a1,r),[x3,y3]=nokta(a0,r), b = (a1-a0)>Math.PI?1:0;
      yollar += `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${b} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} A${r},${r} 0 ${b} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z" fill="${renkOf(d.k)}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" data-kat="${d.k}" style="cursor:pointer"><title>${TYPES[d.k].ad} %${(d.o*100).toFixed(1)}</title></path>`;
    }
    a0 = a1;
  }
  return `<div class="muted" style="margin-bottom:6px">Dağılım · dilime dokunun</div>
  <svg viewBox="0 0 200 200" style="max-width:240px;margin:0 auto" role="img" aria-label="Varlık dağılımı">${yollar}
    <text x="100" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">Varlıklar</text>
    <text x="100" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${gizli?"••••":fKisa(top)}</text></svg>
  <div style="margin-top:8px">${dil.slice().sort((x,y)=>y.v-x.v).map(d=>`<div class="row tap" data-kat="${d.k}">
    <span><span class="dot" style="background:${renkOf(d.k)}"></span>${TYPES[d.k].ad}</span>
    <span class="r"><b>%${(d.o*100).toFixed(d.o<0.1?1:0)}</b> <span class="muted">${para(d.v)}</span> <span class="muted">›</span></span></div>`).join("")}</div>`;
}
const fKisa = v0 => { const k = gosterPB!=="TRY" ? PB[gosterPB].kur() : 1, sem = k && gosterPB==="USD" ? "$" : k && gosterPB==="EUR" ? "€" : "₺", v = k ? v0/k : v0; return v>=1e6 ? sem+new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2}).format(v/1e6)+" mn" : v>=1e3 ? sem+new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(v/1e3)+" bin" : sem+fN2.format(v); };

document.addEventListener("submit", async e => {
  if (e.target.id!=="f") return; e.preventDefault();
  const o = formOku();
  o.qty = sayi(o.qty); o.cost = sayi(o.cost); if ("manualPrice" in o) o.manualPrice = sayi(o.manualPrice);
  if (o.type==="fon" || o.type==="bes") {
    o.symbol = String(o.symbol||"").trim().toUpperCase();
    const tutarHam = sayi(o.tutar), tkur = kurTL(o.tutarCur||"TRY"); delete o.tutar;
    if (tutarHam && tutarHam > 0 && !tkur) return toast("Kur henüz yüklenmedi, biraz bekleyip tekrar deneyin");
    const tutar = tutarHam ? tutarHam * tkur : null;
    if (tutar && tutar > 0) {
      const cf = canliFiyat(o), mp = o.manualPrice, k = kurTL(o.fiyatCur);
      const birim = cf ? cf.p : (mp && k ? mp*k : null);
      if (birim) o.qty = tutar / birim;
      else { o.qty = 1; o.manualPrice = tutar; o.fiyatCur = "TRY"; }
      o.tutarTarih = bugun();
    }
  }
  if (!o.qty || o.qty<=0) return toast(isBA(o)?"Tutar girin":"Miktar girin");
  if (o.type==="mevduat") {
    if (!String(o.banka||"").trim()) return toast("Banka adını girin");
    if (!o.vade) return toast("Vade sonu tarihini girin");
    o.banka=o.banka.trim(); o.cur ||= "TRY"; o.konum="banka"; o.konumNot=o.hesapNot||""; delete o.cost;
    for (const k of ["oran","stopaj","vadeTutar"]) o[k] = sayi(o[k]);
  }
  if (isBA(o)) { if (!String(o.kisi||"").trim()) return toast("Kişi veya kurum girin"); o.kisi=o.kisi.trim(); o.cur ||= "TRY"; delete o.konum; delete o.cost; }
  if (["kripto","bist","abd","fon","bes"].includes(o.type) && !String(o.symbol||"").trim()) return toast("Sembol / kod girin");
  if (o.symbol) o.symbol = o.symbol.trim().toUpperCase();
  const eski = S.assets.find(a=>a.id===o.id);
  if (o.manualPrice!=null && (!eski || eski.manualPrice!==o.manualPrice)) o.priceDate = bugun();
  if (eski) Object.assign(eski, o); else { o.id = crypto.randomUUID(); S.assets.push(o); }
  draft=null; tab=isBA(o)?"ba":"varlik"; render(); window.scrollTo(0,0);
  await kaydet(); if (o.type==="kripto") fiyatlariAl();
});

      }
      screen = kasaDoc ? "unlock" : "setup";
    } catch(e){ screen="login"; render(); const x=document.getElementById("err"); if(x) x.textContent=hataMetni(e); return; }
    render();
  });
}
/* ============ Yeni sürüm kontrolü ============ */
let yeniSurum = null;
async function surumKontrol(){
  try {
    const r = await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const j = await r.json();
    if (j.surum > SURUM && yeniSurum !== j.surum){ yeniSurum = j.surum; surumBandi(j); }
  } catch {}
}
function surumBandi(j){
  document.getElementById("surumBant")?.remove();
  const d = document.createElement("div"); d.id="surumBant";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--acc);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)";
  d.innerHTML = `<div style="flex:1"><b>Yeni sürüm hazır (${esc(j.surum)})</b>${j.not?`<div style="font-size:13px;opacity:.9">${esc(j.not)}</div>`:""}</div><button data-act="guncelle" style="background:#fff;color:#000;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:600">Güncelle</button>`;
  document.body.appendChild(d);
}
surumKontrol();
yenilikleriGoster();
setInterval(surumKontrol, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) surumKontrol(); });

if (CONFIGURED) { FB.getRedirectResult(auth).catch(()=>{}); setTimeout(()=>{ if (screen==="yukleniyor"){ screen="login"; render(); } }, 8000); }
render();
</script>
