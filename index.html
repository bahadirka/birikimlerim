<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.r{text-align:right;white-space:nowrap}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px}
nav button.on{color:var(--acc);font-weight:700}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg)}
main a{color:var(--acc)}
.iconbtn.on{border-color:var(--acc);color:var(--acc)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--fg);font:inherit;font-size:13px;margin-left:6px;cursor:pointer}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.chip b{display:block;font-size:15px}
.chip.up{background:color-mix(in srgb,var(--pos) 9%,var(--card));border-color:color-mix(in srgb,var(--pos) 35%,var(--line))}
.chip.down{background:color-mix(in srgb,var(--neg) 9%,var(--card));border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.chg{font-size:12px;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.chg .up,.tick.up{color:var(--pos);font-weight:600}.chg .down,.tick.down{color:var(--neg);font-weight:600}
.tick{font-size:11px}
.iz-ust{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.iz-ara{margin-bottom:10px}
.iz-cipler{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.iz-cipler::-webkit-scrollbar{display:none}
.iz-cipler button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.iz-cipler button.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.iz-kart{padding:0 12px}
.iz-satir{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.iz-satir:last-child{border-bottom:0}
.iz-satir{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;background:var(--card)}
.iz-satir.surukle{z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.35);border-radius:12px;border-bottom-color:transparent;transition:box-shadow .15s;cursor:grabbing}

.iz-yildiz{background:none;border:0;font-size:20px;color:var(--muted);padding:0 2px;cursor:pointer;line-height:1}
.iz-yildiz.on{color:var(--acc)}
.iz-satir .iz-ik{width:34px;height:34px;font-size:10px}
.iz-ad{flex:1;min-width:0}
.iz-ad b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iz-ad small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iz-fiyat{font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.iz-ch{width:68px;text-align:right;font-weight:600;font-size:14px;white-space:nowrap}
.fp-satir{display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:10px}
.fp-satir.ana{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.fp-ad{width:86px;flex:none;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-cubuk{position:relative;flex:1;height:22px}
.fp-sifir{position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--muted);opacity:.5}
.fp-bar{position:absolute;top:2px;height:18px;border-radius:3px}
.fp-bar.pos{background:var(--pos)}.fp-bar.neg{background:var(--neg)}
.fp-y{width:84px;flex:none;text-align:right;font-size:15px;white-space:nowrap}
.fp-donem{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.fp-donem button{flex:1 0 auto;background:none;border:0;padding:8px 10px;border-radius:16px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.fp-donem button.on{background:var(--acc);color:#fff;font-weight:700}
.grup-alt{margin:0 0 6px 12px;padding-left:10px;border-left:2px solid var(--acc)}
.grup-alt .row{padding:9px 0}
.dt-s{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dt-s:last-child{border-bottom:0}
.dt-s b{text-align:right}
.bo-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 4px;background:var(--line)}
.bo-bar span{height:100%}
.bo-blok{margin-top:8px}
.bo-cip{display:flex;flex-wrap:wrap;gap:5px}
.bo-cip span{font-size:12px;border:1px solid;border-radius:7px;padding:2px 7px}
.pasta-bilgi{border:1px solid;border-radius:12px;padding:10px 12px;margin:10px 0 4px}
.pb-izgara{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px;font-size:14px}
.pb-izgara span{display:block;font-size:11px}
.rp-k{display:flex;align-items:center;gap:10px;margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--fg);cursor:pointer}
.rp-k input{width:20px;height:20px;margin:0;accent-color:var(--acc)}
.ozet-kisa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.ozet-kisa button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ozet-kisa button span{font-size:22px;line-height:1}
.enf-hukum{margin-top:8px;font-size:15px}
.dk-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dk-chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--fg)}
.dk-chip.pos{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.dk-chip.neg{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.dk-chip.uyari{background:color-mix(in srgb,#f08c00 16%,transparent);color:#d9480f}
.dk-chip.bilgi{background:color-mix(in srgb,#1c7ed6 15%,transparent);color:#1971c2}

.dk-s{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dk-s:last-of-type{border-bottom:0}
.dk-aralik{position:relative;height:8px;border-radius:4px;margin:2px 0 0;background:linear-gradient(90deg,color-mix(in srgb,var(--neg) 55%,transparent),color-mix(in srgb,var(--muted) 30%,transparent),color-mix(in srgb,var(--pos) 55%,transparent))}
.dk-isaret{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--fg)}
.hb{display:block;padding:11px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.hb:last-child{border-bottom:0}
.hb-kod{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:6px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);vertical-align:1px}
.hb-b{font-size:15px;font-weight:600;line-height:1.35}
.hb-alt{display:block;font-size:12px;margin-top:3px}
.hb-filtre{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.hb-filtre button{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px}
.hb-filtre button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bes-fon{padding:9px 0;border-bottom:1px solid var(--line)}
.bes-fon:last-of-type{border-bottom:0}
.bes-fon-ust{display:flex;align-items:center;gap:8px;font-size:14px}

.bes-fon-alt{display:flex;justify-content:space-between;font-size:12px}
.sirala{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:2px 16px 6px}

.mk-pill{flex:none;display:flex;align-items:center;border-radius:9px;padding:3px 5px;font-size:11.5px;font-weight:700;background:var(--bg);color:var(--muted);line-height:1.2}

.mk-pill.down{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.mk-fiyat{position:relative;font-size:19px;font-weight:700;margin-top:10px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-anlik{position:relative;font-size:11px;font-weight:600;margin-top:2px}

@keyframes fu{0%{box-shadow:0 0 0 2px var(--pos)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fd{0%{box-shadow:0 0 0 2px var(--neg)}100%{box-shadow:0 0 0 0 transparent}}
.flash-up{animation:fu 1.6s ease-out 2}.flash-down{animation:fd 1.6s ease-out 2}
@media (prefers-reduced-motion:reduce){.flash-up,.flash-down{animation:none}}

.warn{background:rgba(201,42,42,.08);border:1px solid var(--neg);border-radius:12px;padding:12px;font-size:14px;margin-top:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;color:var(--fg)}
.check input{width:auto;margin-top:3px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:10}
.center{max-width:420px;margin:8vh auto 0}
.err{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
svg{width:100%;height:auto;display:block}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:4px}
</style>

/* ============ Şifreleme (cihazda, AES-256-GCM + PBKDF2) ============ */
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const a = new Uint8Array(buf); let s=""; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let anahtarHam = null; // kasa açıkken bellekte; Face ID kaydı için gerekir
async function anahtarUret(parola, salt){
  // deriveBits(256) = deriveKey(AES-256) ile aynı anahtar; eski kasalar aynen açılır
  const base = await crypto.subtle.importKey("raw", te.encode(parola), "PBKDF2", false, ["deriveBits"]);
  anahtarHam = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:310000, hash:"SHA-256"}, base, 256));
  return crypto.subtle.importKey("raw", anahtarHam, "AES-GCM", false, ["encrypt","decrypt"]);
}

/* ============ Face ID ile açma (WebAuthn PRF) ============
   Face ID'nin ürettiği gizli değer, kasa anahtarını SADECE bu cihazda sarar.
   Sunucuya hiçbir şey gitmez; kasa parolası yedek olarak geçerli kalır. */
const fidAnahtar = () => "faceid:" + kasaId;
function fidKayit(){ try { return JSON.parse(lsGet(fidAnahtar()) || "null"); } catch { return null; } }
const fidDestek = () => !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
const fidHazir = () => { const r = fidKayit(); return !!(r && r.ct && kasaDoc && r.salt === kasaDoc.salt); };
function fidSil(){ try { localStorage.removeItem(fidAnahtar()); } catch {} }
async function prfAl(cid, ps){
  const cred = await navigator.credentials.get({publicKey:{challenge: crypto.getRandomValues(new Uint8Array(32)), rpId: location.hostname,
    allowCredentials:[{type:"public-key", id: cid}], userVerification:"required", timeout:60000, extensions:{prf:{eval:{first: ps}}}}});
  const r = cred.getClientExtensionResults()?.prf?.results?.first;
  if (!r) throw new Error("prf-yok");
  return new Uint8Array(r);
}
async function fidSar(prf){
  const k = await crypto.subtle.importKey("raw", prf, "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, anahtarHam);
  const r = fidKayit() || {};
  lsSet(fidAnahtar(), JSON.stringify({...r, iv:b64(iv), ct:b64(ct), salt:kasaDoc.salt}));
}
async function faceIdEtkinlestir(){
  if (!anahtarHam) throw new Error("kilitli");
  const ps = crypto.getRandomValues(new Uint8Array(32));
  const cred = await navigator.credentials.create({publicKey:{
    rp:{name:"Birikimlerim", id: location.hostname},
    user:{id: crypto.getRandomValues(new Uint8Array(16)), name: benEmail || "birikimlerim", displayName: "Birikimlerim kasası"},
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    pubKeyCredParams:[{type:"public-key", alg:-7},{type:"public-key", alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform", residentKey:"preferred", userVerification:"required"},
    timeout:60000, extensions:{prf:{eval:{first: ps}}}}});
  const ext = cred.getClientExtensionResults()?.prf;
  if (ext && ext.enabled === false) throw new Error("prf-yok");
  lsSet(fidAnahtar(), JSON.stringify({cid:b64(cred.rawId), ps:b64(ps)}));
  if (ext?.results?.first) { await fidSar(new Uint8Array(ext.results.first)); return true; }
  return false; // iOS bazen ilk adımda değeri vermez → "Doğrula" ile ikinci dokunuş
}
async function faceIdDogrula(){
  const r = fidKayit(); if (!r?.cid) throw new Error("kayit-yok");
  await fidSar(await prfAl(unb64(r.cid), unb64(r.ps)));
}
async function faceIdAc(){
  const r = fidKayit();
  const prf = await prfAl(unb64(r.cid), unb64(r.ps));
  const k = await crypto.subtle.importKey("raw", prf, "AES-GCM", false, ["decrypt"]);
  anahtarHam = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv: unb64(r.iv)}, k, unb64(r.ct)));
  salt = unb64(kasaDoc.salt);
  key = await crypto.subtle.importKey("raw", anahtarHam, "AES-GCM", false, ["encrypt","decrypt"]);
  S = await coz(key, kasaDoc.iv, kasaDoc.ct);
  S.assets ||= []; S.snapshots ||= [];
}
function fidHata(e){
  if (e?.message === "prf-yok") return "Bu cihaz Face ID ile kasa açmayı desteklemiyor (iPhone'da iOS 18 veya üstü ve Safari gerekir).";
  if (e?.name === "NotAllowedError" || e?.name === "AbortError") return "Face ID iptal edildi ya da süresi doldu. Tekrar deneyin.";
  if (e?.name === "InvalidStateError") return "Bu cihazda zaten bir Face ID kaydı var. Tekrar deneyin.";
  return "Face ID kullanılamadı: " + (e?.message || e?.name || "bilinmeyen hata");
}
async function sifrele(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, te.encode(JSON.stringify(obj)));
  return { iv: b64(iv), ct: b64(ct) };
}
async function coz(key, iv, ct){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: unb64(iv)}, key, unb64(ct));
  return JSON.parse(td.decode(pt));
}

/* ============ Fiyatlar ============ */
function parseTR(v){ if (typeof v==="number") return v; let s=String(v).replace(/[^\d.,-]/g,""); if (s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isNaN(n)?null:n; }
function tch(j,k){ const o=j?.[k]; if(!o) return null; const v=o["Değişim"]??o.Degisim??o.Change??o.change; return v==null?null:parseTR(v); }
function tget(j,k){ const o=j?.[k]; if(!o) return null; const v=o["Satış"]??o.Satis??o.Selling??o.selling; return v==null?null:parseTR(v); }

/* Canlı BIST / ABD / TEFAS: kendi deponuzdaki otomatik görev toplar (yarım saatte bir) */
const CANLI_URL = "https://raw.githubusercontent.com/bahadirka/birikimlerim/fiyatlar/prices.json";
let canli = null, canliSon = 0;
async function canliAl(){
  if (Date.now()-canliSon < 4*60*1000 && canli) return;
  try { const r = await fetch(CANLI_URL+"?t="+Math.floor(Date.now()/240000), {cache:"no-store"}); if (r.ok){ canli = await r.json(); canliSon = Date.now(); } } catch {}
}
function canliFiyat(a){
  if (!canli || !a.symbol) return null;
  const k = String(a.symbol).toUpperCase().replace(/\.IS$/,"");
  const grup = a.type==="bist" ? canli.bist : a.type==="abd" ? canli.abd : (a.type==="fon"||a.type==="bes") ? canli.fon : null;
  const v = grup?.[k]; return (v && v.p>0) ? v : null;
}

function birimTL(a){
  switch(a.type){
    case "kripto": return prices.crypto[cgId(a.symbol)]?.try ?? null;
    case "altin": return prices.gold[a.unit||"gram24"] ?? null;
    case "gumus": return prices.silver.gram ?? null;
    case "nakit": case "alacak": case "borc": return (a.cur||"TRY")==="TRY" ? 1 : (prices.fx[a.cur] ?? null);
    case "bist": { const c=canliFiyat(a); return c ? c.p : sayi(a.manualPrice); }
    case "fon": case "bes": { if (a.hesap) return besDeger(a).deger; const c=canliFiyat(a); if (c) return c.p; const p=sayi(a.manualPrice), k=kurTL(a.fiyatCur); return (p!=null && k!=null) ? p*k : null; }
    case "abd": { const c=canliFiyat(a), p = c ? c.p : sayi(a.manualPrice); return (p!=null && prices.fx.USD) ? p*prices.fx.USD : null; }
  }
  return null;
}
const kurTL = c => (!c || c==="TRY") ? 1 : (prices.fx[c] ?? null);
const maliyetTL = a => { if (a.type==="mevduat"){ const k=kurTL(a.cur); return k==null?null:(+a.qty||0)*k; } const c=sayi(a.cost), k=kurTL(a.costCur); if (c==null||k==null) return null; return a.costTip==="birim" ? c*(+a.qty||0)*k : c*k; };
/* Vadeli mevduat: faiz = anapara × yıllık oran × gün / 365, net = brüt × (1 − stopaj) */
const GUN = 86400000;
function mevduatHesap(a){
  const ana = +a.qty||0, oran = sayi(a.oran)||0, stopaj = sayi(a.stopaj)||0;
  const bas = a.bas ? new Date(a.bas) : null, vade = a.vade ? new Date(a.vade) : null, bugunD = new Date(bugun());
  const gunToplam = (bas && vade) ? Math.max(0, Math.round((vade-bas)/GUN)) : 0;
  const gecen = bas ? Math.min(gunToplam, Math.max(0, Math.round((bugunD-bas)/GUN))) : 0;
  const kalan = vade ? Math.round((vade-bugunD)/GUN) : null;
  const brut = ana * oran/100 * gunToplam/365, netHesapla = brut * (1 - stopaj/100);
  const elle = sayi(a.vadeTutar);
  const vadeSonu = elle!=null ? elle : ana + netHesapla;
  const netFaiz = vadeSonu - ana;
  const simdi = gunToplam ? ana + netFaiz * gecen/gunToplam : ana;
  return {ana, oran, stopaj, gunToplam, gecen, kalan, brut, netFaiz, vadeSonu, simdi, elle: elle!=null};
}
const degerTL = a => {
  if (a.type==="mevduat"){ const k=kurTL(a.cur); return k==null ? null : mevduatHesap(a).simdi*k; }
  const u=birimTL(a); return u==null ? null : u*(+a.qty||0); };
function netHesap(){
  const t = toplam(S.assets);
  let alacak=0, borc=0, eksik=t.eksik;
  for (const a of S.assets) if (isBA(a) && !a.odendi) { const d=degerTL(a); if (d==null) { eksik++; continue; } if (a.type==="alacak") alacak+=d; else borc+=d; }
  return {varlik:t.v, alacak, borc, net:t.v+alacak-borc, eksik, kz:t.kz, kzOran:t.kzOran};
}
/* Kâr/zarar varlığın KENDİ para biriminde: döviz fonunda fonun döviz fiyatı = TEFAS TL fiyatı ÷ önceki iş gününün TCMB döviz alış kuru */
function tcmbKur(tarih, pb){
  const t = canli?.tcmb; if (!t || pb==="TRY") return null;
  const gunler = Object.keys(t).filter(g => g < tarih && t[g]?.[pb]?.da).sort();
  return gunler.length ? t[gunler[gunler.length-1]][pb].da : null;
}
const kzPB = a => (a.type==="fon"||a.type==="bes") ? (a.tutarCur && a.tutarCur!=="TRY" ? a.tutarCur : (a.costCur||"TRY")) : (a.costCur||"TRY");
/* Kripto ve ABD hisselerinde dolar karşılığı (doğrudan dolar fiyatından) */
function usdDeger(a){
  if (a.type==="kripto"){ const u = prices.crypto[cgId(a.symbol)]?.usd; return u!=null ? u*(+a.qty||0) : null; }
  if (a.type==="abd"){ const c = canliFiyat(a), p = c ? c.p : sayi(a.manualPrice); return p!=null ? p*(+a.qty||0) : null; }
  return null;
}
function usdKarsilik(a, d){
  const u = usdDeger(a); if (u==null) return "";
  const birim = a.type==="kripto" ? prices.crypto[cgId(a.symbol)]?.usd : null;
  return `<div style="font-size:14px;font-weight:600">${para(u, fUSD2)}</div>${birim?`<div class="muted" style="font-size:11px">1 ${esc(String(a.symbol||"").toUpperCase())} = ${fUSD2.format(birim)}</div>`:""}`;
}
function kzHesap(a){
  if (a.type==="mevduat"){ const m=mevduatHesap(a), k=kurTL(a.cur||"TRY"); return (m.ana && k) ? {pb:"TRY", tl:true, oran:m.netFaiz/m.ana*100, tutar:m.netFaiz*k, etiket:"vade sonu kârı"} : null; }
  const c = sayi(a.cost); if (c==null || !c) return null;
  const pb = kzPB(a), qty = +a.qty||0;
  let maliyet;
  if ((a.costCur||"TRY")===pb) maliyet = a.costTip==="birim" ? c*qty : c;
  else { const mt = maliyetTL(a), k = kurTL(pb); if (mt==null || !k) return null; maliyet = mt/k; }
  let deger = null;
  const cf = canliFiyat(a);
  if ((a.type==="fon"||a.type==="bes") && pb!=="TRY" && cf){ const k = tcmbKur(cf.t, pb) || kurTL(pb); if (k) deger = cf.p/k*qty; }
  if (deger==null && pb==="USD" && (a.type==="kripto"||a.type==="abd")) deger = usdDeger(a);
  if (deger==null){ const d = degerTL(a), k = kurTL(pb); if (d==null || !k) return null; deger = d/k; }
  return {pb, oran:(deger/maliyet-1)*100, tutar:deger-maliyet};
}
/* Kâr/zarar tutarı: Özet'te USD/EUR seçiliyse hep o para biriminde; TL seçiliyken dolar bazlı varlıklar (ABD, kripto) dolar kalır */
const khPara = kh => { const v = Math.abs(kh.tutar); if (kh.tl || kh.pb==="TRY") return para(v);
  if (gosterPB!=="TRY" && kh.pb!==gosterPB){ const k = kurTL(kh.pb); if (k) return para(v*k); } return pbFmt(kh.pb).format(v); };
/* Kurum / konum adı: kripto borsasında borsanın adı (Binance, BtcTurk…) */
const kurumAd = a => a.konumNot || (a.konum==="borsa" && a.borsaAd) || a.banka || KONUM[a.konum] || "";
const pbFmt = pb => pb==="USD" ? fUSD : pb==="EUR" ? fEUR : fTLn;
function toplam(list){ let v=0, eksik=0, mal=0, malDeger=0; for (const a of list){ if (isBA(a)) continue; const d=degerTL(a); if (d==null) { eksik++; continue; } v+=d; const c=maliyetTL(a); if (c!=null){ mal+=c; malDeger+=d; } } return {v, eksik, kz: mal ? malDeger-mal : null, kzOran: mal ? (malDeger-mal)/mal*100 : null}; }

function gunlukKayit(){
  if (!S || !S.assets.length) return;
  const t = netHesap(); if (t.eksik) return;
  const d = bugun(), son = S.snapshots[S.snapshots.length-1];
  if (son?.d === d) son.t = Math.round(t.net);
  else { S.snapshots.push({d, t:Math.round(t.net)}); if (S.snapshots.length>800) S.snapshots.shift(); kaydet(true); }
}

/* Ortak kasa: diğer cihazdaki değişiklikleri anında al */
function dinle(){
  if (demo || unsub) return;
  unsub = FB.onSnapshot(FB.doc(db,"kasa",kasaId), async snap => {
    const d = snap.data(); if (!d || snap.metadata.hasPendingWrites) return;
    if (d.updatedAt === kasaDoc?.updatedAt) { kasaDoc = d; return; }
    kasaDoc = d;
    if (!key || screen!=="app") return;
    if (d.salt !== b64(salt)) { kilitle(); toast("Kasa parolası değiştirildi, yeni parolayla açın"); return; }
    try {
      S = await coz(key, d.iv, d.ct); S.assets ||= []; S.snapshots ||= [];
      if (tab!=="ekle") render();
      toast((d.guncelleyen && d.guncelleyen!==benEmail ? d.guncelleyen : "Diğer cihaz") + " güncelledi");
    } catch {}
  });
}

async function uyeEkle(mail){
  mail = mail.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return toast("Geçerli bir e-posta girin");
  if (mail === benEmail) return toast("Kendi adresinizi eklemenize gerek yok");
  const liste = [...new Set([...(kasaDoc.uyeler||[]), mail])];
  await FB.setDoc(FB.doc(db,"uyelik",mail), {kasa:uid});
  await FB.setDoc(FB.doc(db,"kasa",kasaId), {uyeler:liste}, {merge:true});
  kasaDoc.uyeler = liste; render(); toast("Eklendi");
}
async function uyeSil(mail){
  if (!confirm(mail+" kasaya erişemesin mi?\n\nNot: Kasa parolasını biliyorsa, ardından parolayı da değiştirmeniz önerilir.")) return;
  const liste = (kasaDoc.uyeler||[]).filter(m=>m!==mail);
  await FB.setDoc(FB.doc(db,"kasa",kasaId), {uyeler:liste}, {merge:true});
  await FB.deleteDoc(FB.doc(db,"uyelik",mail));
  kasaDoc.uyeler = liste; render(); toast("Erişim kaldırıldı");
}

/* ============ Piyasa Nabzı: 1 yıllık günlük kapanışlardan teknik özet ============
   Puan (0–100) = ortalama( RSI-14, 52 haftalık aralıktaki konum, 50 ve 200 günlük ortalamaya uzaklık ).
   Yatırım tavsiyesi değildir; yalnızca fiyatın kendi geçmişine göre nerede durduğunu özetler. */
const nabizOnbellek = {};
const NABIZ_EVRE = [
  [0,15,"Aşırı korku","Fiyat bir yılın en zayıf bölgesinde; satış baskısı çok yoğun.","#c92a2a"],
  [15,30,"Panik satış","Fiyat ortalamaların belirgin şekilde altında; düşüş sert.","#e8590c"],
  [30,45,"Kararsızlık","Destekler zorlanıyor; yön henüz netleşmedi.","#e0b84a"],
  [45,55,"Denge","Fiyat ortalamaların çevresinde; alıcı ve satıcı dengede.","#adb5bd"],
  [55,70,"Toparlanma","Fiyat ortalamaların üstüne çıkıyor; ivme olumlu.","#2f9e44"],
  [70,85,"İyimserlik","Güçlü yükseliş; fiyat yıllık aralığın üst bölgesinde.","#1c7ed6"],
  [85,101,"Aşırı coşku","Fiyat bir yılın zirvesine yakın ve ortalamalardan çok uzak.","#7048e8"],
];
const ort = (v, n) => v.length>=n ? v.slice(-n).reduce((a,b)=>a+b,0)/n : null;
function rsi14(v){
  if (v.length < 16) return null;
  let k=0, z=0; for (let i=v.length-14;i<v.length;i++){ const d=v[i]-v[i-1]; if (d>0) k+=d; else z-=d; }
  return z===0 ? 100 : 100 - 100/(1+k/z);
}
const sig = (x, olcek) => 100/(1+Math.exp(-x/olcek)); // uzaklığı 0–100'e çevirir
/* Her aralık kendi verisiyle: Yıl = 50/200 günlük; Ay = 5/20 günlük; Hafta ve Gün = dönemin 1/5'i ve tamamı */
const NABIZ_AYAR = {
  yil:  {ad:"Yıllık görünüm", kisa:50, uzun:200, kAd:"50G ort.", uAd:"200G ort.", zAd:"1 yıllık zirve", o1:4, o2:8},
  ay:   {ad:"Aylık görünüm", kisa:5, uzun:20, kAd:"5G ort.", uAd:"20G ort.", zAd:"Aylık zirve", o1:1.5, o2:3},
  hafta:{ad:"Haftalık görünüm", kisa:null, uzun:null, kAd:"1G ort.", uAd:"5G ort.", zAd:"5 günlük zirve", o1:0.8, o2:1.6},
  gun:  {ad:"Gün içi görünüm", kisa:null, uzun:null, kAd:"Son saatler ort.", uAd:"Gün içi ort.", zAd:"Gün içi zirve", o1:0.3, o2:0.6},
};
function nabizHesapla(v, guncel, mod="yil"){
  const A = NABIZ_AYAR[mod];
  if (!v || v.length < (mod==="yil"?60:12)) return null;
  v = v.slice(); if (guncel && isFinite(guncel) && (mod==="yil"||mod==="ay")) v.push(guncel);
  const n = v.length, kisa = A.kisa || Math.max(3, Math.round(n/5)), uzun = Math.min(A.uzun || n, n);
  const p = v[n-1], m50 = ort(v, Math.min(kisa, n)), m200 = ort(v, uzun);
  const rPer = Math.min(14, n-2), r = (()=>{ let k=0,z=0; for (let i=n-rPer;i<n;i++){ const d=v[i]-v[i-1]; if (d>0) k+=d; else z-=d; } return z===0 ? 100 : 100-100/(1+k/z); })();
  const dilim = mod==="yil" ? v.slice(-252) : v;
  const yuk = Math.max(...dilim), dus = Math.min(...dilim);
  const aralik = yuk>dus ? (p-dus)/(yuk-dus)*100 : 50;
  const u50 = m50 ? (p/m50-1)*100 : 0, u200 = m200 ? (p/m200-1)*100 : 0;
  const parca = [r, aralik, sig(u50, A.o1), sig(u200, A.o2)];
  const puan = Math.max(0, Math.min(100, parca.reduce((a,b)=>a+b,0)/parca.length));
  const evre = NABIZ_EVRE.find(e => puan>=e[0] && puan<e[1]);
  const trend = (p>m50 && m50>m200) ? ["Yükseliş","yukari"] : (p<m50 && p<m200) ? ["Daralma","asagi"] : ["Kararsız","yatay"];
  return {mod, A, puan, evre, trend, p, m50, m200, r, yuk, dus, aralik, u50, u200, zirve:(p/yuk-1)*100, kisa: mod==="yil" && n<200};
}
function nabizGosterge(puan){
  const R=70, C=90, Y=86, a = Math.PI*(1-puan/100);
  const yay = (b,e,renk) => { const a0=Math.PI*(1-b/100), a1=Math.PI*(1-e/100);
    return `<path d="M${C+R*Math.cos(a0)},${Y-R*Math.sin(a0)} A${R},${R} 0 0 1 ${C+R*Math.cos(a1)},${Y-R*Math.sin(a1)}" stroke="${renk}" stroke-width="10" fill="none" opacity=".85"/>`; };
  const segs = NABIZ_EVRE.map(e=>yay(e[0]+0.8, Math.min(e[1],100)-0.8, e[4])).join("");
  return `<svg viewBox="0 0 180 104" style="width:200px;max-width:100%;display:block;margin:0 auto" aria-hidden="true">${segs}
    <line x1="${C}" y1="${Y}" x2="${C+(R-14)*Math.cos(a)}" y2="${Y-(R-14)*Math.sin(a)}" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${C}" cy="${Y}" r="4" fill="var(--fg)"/></svg>`;
}
function nabizHTML(n, f){

    <div class="nb-evre" style="border-color:${renk}"><div class="muted nb-k">Durum</div><div class="nb-ad" style="color:${renk}">${ad}</div><div>${anlam}</div></div>

      <div><div class="muted nb-k">${n.A.zAd}</div><b>${F(n.yuk)}</b></div>
      <div><div class="muted nb-k">${n.A.uAd}</div><b>${F(n.m200)}</b></div>

    <div class="nb-cubuk">${NABIZ_EVRE.map(e=>`<span class="${e===n.evre?"on":""}" style="--r:${e[4]}">${e[2]}</span>`).join("")}</div>
    <p class="muted" style="font-size:11px;margin:8px 0 0">${n.kisa?"200 günden kısa geçmiş: uzun ortalama mevcut verinin tamamından hesaplandı. ":""}Gösterge, seçili aralıktaki (Gün / Hafta / Ay / Yıl) fiyat geçmişine göre konumu özetler; aralık değişince puan da değişir. Yatırım tavsiyesi değildir.</p>

async function grafikAc(k, r="gun"){

const HAM = "https://raw.githubusercontent.com/bahadirka/birikimlerim/fiyatlar/";
const hisseGrafikOnbellek = {};
async function hisseGrafikAl(k){
  if (hisseGrafikOnbellek[k]) return hisseGrafikOnbellek[k];
  const [g, kod] = [k[0]==="b"?"bist":"abd", k.slice(2)];
  try { const r = await fetch(HAM+"grafik/"+g+"/"+encodeURIComponent(kod)+".json?t="+Math.floor(Date.now()/600000)); if (!r.ok) return null; return hisseGrafikOnbellek[k] = await r.json(); } catch { return null; }
}

let izSur = null, izTikEngel = 0;
const izSiralanabilir = () => tab==="izle" && izGrup==="fav" && !izAra.trim() && !izSirala;
function izSurBasla(row, y){
  izSur = {row, y0:y, kayma:0, aktif:false, zaman: setTimeout(()=>{
    if (!izSur) return; izSur.aktif = true; row.classList.add("surukle"); try { navigator.vibrate?.(12); } catch {}
  }, 380)};
}
function izSurHareket(y, e){
  if (!izSur) return;
  if (!izSur.aktif){ if (Math.abs(y-izSur.y0) > 8){ clearTimeout(izSur.zaman); izSur = null; } return; }
  e?.preventDefault?.();
  const row = izSur.row;
  let dy = y - izSur.y0 - izSur.kayma;
  const sonraki = row.nextElementSibling, onceki = row.previousElementSibling;
  if (dy > 0 && sonraki && dy > sonraki.offsetHeight/2){ row.parentNode.insertBefore(sonraki, row); izSur.kayma += sonraki.offsetHeight; dy -= sonraki.offsetHeight; }
  else if (dy < 0 && onceki && -dy > onceki.offsetHeight/2){ row.parentNode.insertBefore(row, onceki); izSur.kayma -= onceki.offsetHeight; dy += onceki.offsetHeight; }
  row.style.transform = `translateY(${dy}px)`;
}
function izSurBitir(){
  if (!izSur) return;
  clearTimeout(izSur.zaman);
  if (izSur.aktif){
    const row = izSur.row; row.classList.remove("surukle"); row.style.transform = "";
    const sira = [...document.querySelectorAll("#izListe [data-iz]")].map(x=>x.dataset.iz);
    S.izleme = sira; kaydet(true); izTikEngel = Date.now();
  }
  izSur = null;
}
document.addEventListener("touchstart", e => { if (!izSiralanabilir() || e.target.closest("[data-yildiz]")) return; const r = e.target.closest("#izListe [data-iz]"); if (r) izSurBasla(r, e.touches[0].clientY); }, {passive:true});
document.addEventListener("touchmove", e => { if (izSur) izSurHareket(e.touches[0].clientY, e); }, {passive:false});
document.addEventListener("touchend", izSurBitir); document.addEventListener("touchcancel", izSurBitir);
document.addEventListener("mousedown", e => { if (!izSiralanabilir() || e.button!==0 || e.target.closest("[data-yildiz]")) return; const r = e.target.closest("#izListe [data-iz]"); if (r) izSurBasla(r, e.clientY); });
document.addEventListener("mousemove", e => { if (izSur) izSurHareket(e.clientY, e); });
document.addEventListener("mouseup", izSurBitir);

/* ============ Sanal işlem (paper trading) — gerçek para yok ============
   Kurallar uygulama açıkken ve fiyatlar yenilendikçe kontrol edilir (dakikada bir). */
const SN_BAS = {TRY:1000000, USD:20000};
function snPB(k){
  if (k.startsWith("b:") || ["gram24","ceyrek","gumus","USD","EUR","GBP"].includes(k)) return "TRY";
  if (k.startsWith("a:") || k.startsWith("c:") || ["ONS","AGONS","BRENT","EURUSD","btc"].includes(k)) return "USD";
  return null;
}
const sanalIslenebilir = k => !!snPB(k) && !k.startsWith("f:");
function snHazir(){ if (!S.sanal) S.sanal = {bas:{...SN_BAS}, nakit:{...SN_BAS}, poz:{}, emir:[], gecmis:[]}; return S.sanal; }
const snF = pb => pb==="USD" ? fUSD2 : fTL2n;
const fAdet = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:6});
const snAd = k => izBul(k)?.l || k;
function snFiyat(k){ const o = izBul(k); return (o && o.v>0) ? o.v : null; }
function snIslem(k, yon, adet, fiyat, neden){
  const sn = snHazir(), pb = snPB(k); adet = +adet;
  if (!pb || !(adet>0) || !(fiyat>0)) return "Geçersiz işlem";
  const tutar = adet*fiyat, poz = sn.poz[k] || {adet:0, ort:0, pb};
  if (yon==="al"){
    if (sn.nakit[pb] < tutar - 1e-9) return `Yetersiz sanal ${pb==="USD"?"dolar":"TL"} bakiye`;
    sn.nakit[pb] -= tutar; poz.ort = (poz.ort*poz.adet + tutar)/(poz.adet+adet); poz.adet += adet; poz.pb = pb; sn.poz[k] = poz;
  } else {
    if (poz.adet < adet - 1e-9) return "Elinizde bu kadar yok";
    sn.nakit[pb] += tutar; const kz = (fiyat-poz.ort)*adet; poz.adet -= adet;
    if (poz.adet < 1e-9) delete sn.poz[k]; else sn.poz[k] = poz;
    sn.gecmis.unshift({t:Date.now(), k, yon, adet, fiyat, pb, kz, neden}); kaydet(true); return null;
  }
  sn.gecmis.unshift({t:Date.now(), k, yon, adet, fiyat, pb, neden}); if (sn.gecmis.length>300) sn.gecmis.length=300;
  kaydet(true); return null;
}
function sanalKontrol(){
  const sn = S?.sanal; if (!sn || demo && !sn) return;
  if ([...sn.emir.map(e=>e.k), ...Object.keys(sn.poz)].some(k=>k.startsWith("c:"))) kriptoAl();
  let oldu = [];
  for (const e of sn.emir.filter(e=>e.durum==="bekliyor")){
    const p = snFiyat(e.k); if (!p) continue;
    if ((e.kosul==="ustune" && p>=e.fiyat) || (e.kosul==="altina" && p<=e.fiyat)){
      let adet = e.tutar ? e.tutar/p : e.adet; if (e.k.startsWith("b:")) adet = Math.floor(adet);
      const hata = adet>0 ? snIslem(e.k, e.yon, adet, p, `Kural: ${e.kosul==="ustune"?"≥":"≤"} ${snF(snPB(e.k)).format(e.fiyat)}`) : "Tutar 1 adede yetmiyor";
      if (!hata && e.yon==="al" && (e.sl||e.tp) && sn.poz[e.k]) { if (e.sl) sn.poz[e.k].sl = e.sl; if (e.tp) sn.poz[e.k].tp = e.tp; }
      e.durum = hata ? "iptal" : "gerçekleşti"; e.sonuc = hata || `${snF(snPB(e.k)).format(p)} fiyattan`; e.zaman = Date.now();
      oldu.push(`${e.yon==="al"?"AL":"SAT"} ${snAd(e.k)}${hata?" — "+hata:""}`);
    }
  }
  for (const [k, z] of Object.entries(sn.poz)){
    const p = snFiyat(k); if (!p) continue;
    if (z.sl && p<=z.sl){ snIslem(k,"sat",z.adet,p,"Zarar kes"); oldu.push("Zarar kes: "+snAd(k)); }
    else if (z.tp && p>=z.tp){ snIslem(k,"sat",z.adet,p,"Kâr al"); oldu.push("Kâr al: "+snAd(k)); }
  }
  if (oldu.length){ kaydet(true); toast("Sanal işlem: "+oldu.join(", ")); if (tab==="sanal") render(); }
}
let snSecili = null;
function snDeger(){
  const sn = snHazir(), t = {TRY:sn.nakit.TRY, USD:sn.nakit.USD};
  for (const [k,z] of Object.entries(sn.poz)){ const p = snFiyat(k) ?? z.ort; t[z.pb] += z.adet*p; }
  return t;
}

  return `<div class="row" style="padding:0 0 6px"><button class="iconbtn" data-tab="izle" style="margin:0">‹ İzleme</button><span class="tag" style="border-color:var(--acc);color:var(--acc)">SANAL · gerçek para yok</span></div>

      }
      const kripto = tip==="kripto";
      const ayni = S.assets.find(a => a.type===tip && String(a.symbol).toUpperCase()===x.s && ((a.konumNot||"")===x.y || (kripto && (a.borsaAd||"")===x.y) || (x.o && (a.konumNot||"")===x.o)));

      else { S.assets.push({id:crypto.randomUUID(), type:tip, symbol:x.s, qty:x.q, konum:"araci", ...yer, ...mal}); yeni++; }

/* ============ Fon performans karşılaştırması ============ */
const FP_DONEM = [["1H","1H"],["1A","1A"],["3A","3A"],["6A","6A"],["BY","Bu Yıl"],["1Y","1Y"],["5Y","5Y"]];
const FP_KIYAS = [["TUFE","TÜFE","%","#868e96"],["XU100","XU100","BIST","#e03131"],["ALTIN","ALT/TL","ALT","#eda100"],["USD","USD/TL","USD","#2f9e44"],["EUR","EUR/TL","EUR","#2a78d6"]];
let fonGetiri = null, fonGetiriSon = 0, fpDurum = null;
async function fonGetiriAl(){
  if (fonGetiri && Date.now()-fonGetiriSon < 30*60000) return fonGetiri;
  try { const r = await fetch(HAM+"fon_getiri.json?t="+Math.floor(Date.now()/1800000)); if (r.ok){ fonGetiri = await r.json(); fonGetiriSon = Date.now(); } } catch {}
  return fonGetiri;
}
async function fonPerfAc(kod, d="1H"){
  const kendi = S?.assets?.find(a=>(a.type==="fon"||a.type==="bes") && String(a.symbol).toUpperCase()===kod);
  fpDurum = {kod, d, pb: kendi?.tutarCur==="USD" ? "USD" : "TRY"}; fonPerfCiz(); await Promise.all([fonGetiriAl(), analizAl()]); if (fpDurum?.kod===kod) fonPerfCiz();
}
/* Fonumun hangi para biriminde takip edildiği (döviz fonları birbiriyle) */
const fonPB = kod => S?.assets?.find(a=>(a.type==="fon"||a.type==="bes") && String(a.symbol).toUpperCase()===kod)?.tutarCur || "TRY";
const usdBazli = (r, u) => (r==null || u==null) ? null : ((1+r/100)/(1+u/100)-1)*100;
function fonPerfCiz(){
  const P = fpDurum; if (!P) return;
  let w = document.getElementById("fpPencere");
  if (!w){ w = document.createElement("div"); w.id="fpPencere"; w.className="gp"; document.body.appendChild(w); }
  const f = canli?.fon?.[P.kod], g = fonGetiri;
  let govde;
  if (!g) govde = `<div class="gp-bos" style="height:220px">Yükleniyor…</div>`;
  else {
    const K = {...(g.kiyas?.[P.d] || {}), TUFE: analiz?.tufe ? tufeDonem(g.donem?.[P.d], g.ref||g.tarih) : null}, U = K.USD, usd = P.pb==="USD";
    const cev = v => usd ? usdBazli(v, U) : v;
    const kiyas = usd
      ? [["XU100","XU100 ($)","BIST","#e03131",cev(K.XU100)],["ALTIN","ALTIN ($)","ALT","#eda100",cev(K.ALTIN)],["EUR","EUR/USD","EUR","#2a78d6",cev(K.EUR)]]
      : FP_KIYAS.map(([k,l,ik,r])=>[k,l,ik,r,K[k]]);
    const benimPB = fonPB(P.kod);
    const digerleri = [...new Set((S?.assets||[]).filter(a=>(a.type==="fon"||a.type==="bes") && a.symbol && (a.tutarCur||"TRY")===benimPB).map(a=>String(a.symbol).toUpperCase()))].filter(k=>k!==P.kod);
    const fonlar = [P.kod, ...digerleri].map(k=>({l:k, ik:k, r:k===P.kod?"#1baf7a":"#7048e8", v:cev(g.fon?.[k]?.[P.d]), ana:k===P.kod})).sort((a,b)=>(b.v??-1e9)-(a.v??-1e9));
    const satir = [...kiyas.map(([k,l,ik,r,v])=>({l, ik, r, v})), ...fonlar];
    const mx = Math.max(1, ...satir.map(x=>Math.abs(x.v ?? 0)));
    govde = satir.map(x => {
      const v = x.v, gen = v==null ? 0 : Math.abs(v)/mx*50, cls = v==null ? "muted" : v>=0 ? "pos" : "neg";
      return `<div class="fp-satir${x.ana?" ana":""}"><span class="mk-ik iz-ik" style="background:${x.r}">${esc(x.ik)}</span><b class="fp-ad">${esc(x.l)}</b>
        <div class="fp-cubuk"><span class="fp-sifir"></span>${v==null?"":`<span class="fp-bar ${cls}" style="${v>=0?`left:50%`:`right:50%`};width:${gen}%"></span>`}</div>
        <b class="fp-y ${cls}">${v==null?"—":yuzde(v)+(v>=0?" ▲":" ▼")}</b></div>`;

const RPW = 1588, RPH = 2246, RPM = 72;          // A4 @ ~192 dpi, kenar boşluğu
function rpPdf(jpegler){                          // jpegler: [Uint8Array] — her biri bir tam sayfa

  const yaz = x => { const b = typeof x==="string" ? enc.encode(x) : x; parca.push(b); n += b.length; };
  const obj = (no, govde, akis) => { ofs[no] = n; yaz(`${no} 0 obj\n${govde}\n`); if (akis){ yaz("stream\n"); yaz(akis); yaz("\nendstream\n"); } yaz("endobj\n"); };

  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${sayfa} >>`);
  jpegler.forEach((j, i) => {
    const s = 3+i*3, icerik = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(s, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${s+2} 0 R >> >> /Contents ${s+1} 0 R >>`);
    obj(s+1, `<< /Length ${icerik.length} >>`, enc.encode(icerik));
    obj(s+2, `<< /Type /XObject /Subtype /Image /Width ${RPW} /Height ${RPH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>`, j);
  });

  yaz(`xref\n0 ${adet}\n0000000000 65535 f \n` + ofs.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
  yaz(`trailer\n<< /Size ${adet} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parca, {type:"application/pdf"});
}

let analiz = null, analizSon = 0, ekVeriIstek = false, ekVeriDeneme = 0;

/* TÜFE: aylık % değişimlerden endeks kurulur; gün içindeki kısım ay oranıyla orantılanır.
   Son açıklanan aydan sonrası, son aylık oranla tahmin edilir. */
const ayKaydir = (ay, n) => { let [y, m] = ay.split("-").map(Number); m += n; while (m<=0){m+=12;y--;} while (m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,"0")}`; };
function tufeAt(t){
  const s = analiz?.tufe; if (!s?.length) return null;
  const E = {}; let I = 100; E[ayKaydir(s[0][0], -1)] = 100;
  for (const [ay,,aylik] of s){ I *= 1 + aylik/100; E[ay] = I; }
  const son = s[s.length-1][0], sonOran = s[s.length-1][2];
  const d = new Date(t), ay = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`, onceki = ayKaydir(ay, -1);
  if (onceki < ayKaydir(s[0][0], -1)) return null;
  let taban = E[onceki], oran;
  if (taban == null){ taban = E[son]; for (let a = son; a < onceki; a = ayKaydir(a, 1)) taban *= 1 + sonOran/100; oran = sonOran; }
  else oran = E[ay] != null ? (E[ay]/taban - 1)*100 : sonOran;
  const ayGun = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return taban * Math.pow(1 + oran/100, d.getDate()/ayGun);
}
function tufeDonem(bas, bit = Date.now()){ const a = tufeAt(bas), b = tufeAt(bit); return (a && b) ? (b/a - 1)*100 : null; }
const tufeSonAy = () => { const s = analiz?.tufe; if (!s?.length) return null; const [y, m] = s[s.length-1][0].split("-"); return new Date(+y, +m-1, 1).toLocaleDateString("tr-TR",{month:"long",year:"numeric"}); };
const reel = (nominal, enf) => (nominal==null || enf==null) ? null : ((1+nominal/100)/(1+enf/100) - 1)*100;

/* Bir varlığın seçilen dönemdeki TL getirisi (bugünkü miktarla dönem başından tutulmuş sayılır) */
const DONEMLER = [["1A","1 ay"],["3A","3 ay"],["6A","6 ay"],["BY","Yıl başı"],["1Y","1 yıl"]];
function varlikDonemGetiri(a, d){
  const K = fonGetiri?.kiyas?.[d] || {}, sy = String(a.symbol||"").toUpperCase(), H = analiz?.hisse;
  switch (a.type){
    case "bist": return H?.bist?.[sy]?.g?.[d] ?? null;
    case "abd": { const g = H?.abd?.[sy]?.g?.[d]; return (g==null || K.USD==null) ? null : ((1+g/100)*(1+K.USD/100) - 1)*100; }
    case "fon": case "bes": {
      if (!a.hesap) return fonGetiri?.fon?.[sy]?.[d] ?? null;
      let w = 0, t = 0; for (const f of a.fonlar||[]){ const g = fonGetiri?.fon?.[f.k]?.[d], v = sayi(f.tutar)||0; if (g!=null){ w += v; t += v*g; } }
      const top = sayi(a.toplam) || 0; return (top && w/top >= 0.5) ? t/w : null; }
    case "altin": return K.ALTIN ?? null;
    case "gumus": return K.GUMUS ?? null;
    case "kripto": return cgId(a.symbol)==="bitcoin" ? (K.BTC ?? null) : null;
    case "nakit": { const c = a.cur||"TRY"; return c==="TRY" ? 0 : c==="USD" ? (K.USD ?? null) : c==="EUR" ? (K.EUR ?? null) : null; }
    case "mevduat": {
      const bas = fonGetiri?.donem?.[d], bit = fonGetiri?.ref; if (!bas || !bit) return null;
      const m = mevduatHesap(a), gun = (new Date(bit) - new Date(bas))/GUN, r = m.oran*(1-m.stopaj/100)*gun/365;
      const c = a.cur||"TRY", fx = c==="TRY" ? 0 : c==="USD" ? K.USD : c==="EUR" ? K.EUR : null;
      return fx==null ? null : ((1+r/100)*(1+fx/100) - 1)*100;
    }
  }
  return null;
}
function portfoyDonem(d){
  let top = 0, kap = 0, agirlik = 0;
  for (const a of S.assets){ if (isBA(a)) continue; const v = degerTL(a); if (!v) continue; top += v;
    const g = varlikDonemGetiri(a, d); if (g==null) continue; kap += v; agirlik += v * g; }
  return {g: kap ? agirlik/kap : null, kapsam: top ? kap/top : 0};
}

/* ============ Durum kartı: nesnel göstergeler — tavsiye değildir ============ */
function durumHesap(a){
  const sy = String(a.symbol||"").toUpperCase(), H = analiz?.hisse?.[a.type]?.[sy], T = analiz?.hedef?.[a.type]?.[sy];
  if (!H) return null;
  const p = canli?.[a.type]?.[sy]?.p ?? H.son, s = {};
  if (H.ma50){
    if (H.ma200){
      if (p > H.ma50 && H.ma50 > H.ma200) s.trend = {m:"Yükseliş trendi", c:"pos", a:"Fiyat 50 ve 200 günlük ortalamanın üstünde"};
      else if (p < H.ma50 && H.ma50 < H.ma200) s.trend = {m:"Düşüş trendi", c:"neg", a:"Fiyat 50 ve 200 günlük ortalamanın altında"};
      else s.trend = {m:"Karışık trend", c:"notr", a:`Fiyat 50 günlüğün ${p>H.ma50?"üstünde":"altında"}, 200 günlüğün ${p>H.ma200?"üstünde":"altında"}`};
    } else s.trend = p > H.ma50 ? {m:"Kısa vade yukarı", c:"pos", a:"Fiyat 50 günlük ortalamanın üstünde"} : {m:"Kısa vade aşağı", c:"neg", a:"Fiyat 50 günlük ortalamanın altında"};
  }
  if (H.rsi!=null) s.rsi = H.rsi >= 70 ? {m:`RSI ${fN.format(H.rsi)} · aşırı alım`, c:"uyari", a:"Kısa sürede çok yükseldi; geri çekilme riski artar"}
    : H.rsi <= 30 ? {m:`RSI ${fN.format(H.rsi)} · aşırı satım`, c:"bilgi", a:"Kısa sürede çok düştü; tepki gelebilir ama düşüş sürebilir de"}
    : {m:`RSI ${fN.format(H.rsi)} · nötr`, c:"notr", a:"Ne aşırı alım ne aşırı satım bölgesinde"};
  if (H.h52 && H.l52){ s.zirve = (p/H.h52 - 1)*100; s.konum = H.h52>H.l52 ? Math.min(1, Math.max(0, (p-H.l52)/(H.h52-H.l52))) : 0.5; s.h52 = H.h52; s.l52 = H.l52; }
  if (T?.ort){ s.hedef = T; s.pot = (T.ort/p - 1)*100; }
  s.p = p; s.g = H.g;
  return s;
}

/* Portföy geneli uyarılar + tüm hisselerin durum özeti */
function yogunlukUyarilari(){
  const u = [], top = S.assets.filter(a=>!isBA(a)).reduce((x,a)=>x+(degerTL(a)||0),0); if (!top) return u;

  for (const [k, v] of Object.entries(sym)) if (v/top >= 0.2) u.push({c:"neg", m:`${k.split(":")[1]} tek başına portföyün %${fN2.format(v/top*100)}'i`, a:"Tek bir varlıkta yüksek yoğunluk riski artırır."});
  const tip = {}; for (const a of S.assets){ if (isBA(a)) continue; tip[a.type] = (tip[a.type]||0) + (degerTL(a)||0); }
  for (const [k, v] of Object.entries(tip)) if (v/top >= 0.5) u.push({c:"uyari", m:`${TYPES[k].ad} portföyün %${fN2.format(v/top*100)}'i`, a:"Tek varlık sınıfı ağırlığı yüksek."});
  const tl = S.assets.filter(a=>a.type==="nakit" && (a.cur||"TRY")==="TRY").reduce((x,a)=>x+(degerTL(a)||0),0);
  if (tl/top >= 0.15){ const t1 = analiz?.tufe?.length ? analiz.tufe[analiz.tufe.length-1][1] : null;
    u.push({c:"uyari", m:`TL nakit portföyün %${fN2.format(tl/top*100)}'i`, a:`Faizsiz TL, enflasyon kadar değer kaybeder${t1?` (yıllık TÜFE %${fN2.format(t1)})`:""}.`}); }
  return u;
}

function haberKodlari(){
  const m = new Map();
  for (const a of S.assets) if ((a.type==="bist"||a.type==="abd") && a.symbol) m.set(a.type+":"+String(a.symbol).toUpperCase(), "var");
  for (const k of izFavori()){ const g = k.startsWith("b:") ? "bist" : k.startsWith("a:") ? "abd" : null; if (g && !m.has(g+":"+k.slice(2))) m.set(g+":"+k.slice(2), "iz"); }
  return m;
}
async function haberAl(anahtar){
  const o = haberOnbellek[anahtar]; if (o && Date.now()-o.t < 20*60000) return o.d;
  const [g, k] = anahtar.split(":");
  try { const r = await fetch(`${HAM}haber/${g}/${encodeURIComponent(k)}.json?t=${Math.floor(Date.now()/1200000)}`); const d = r.ok ? await r.json() : []; haberOnbellek[anahtar] = {t:Date.now(), d}; return d; }
  catch { const d = o?.d || []; haberOnbellek[anahtar] = {t:Date.now(), d}; return d; }
}
async function haberleriYukle(){
  const kod = [...haberKodlari().keys()]; haberDurum = "yukleniyor";
  await Promise.all(kod.map(haberAl)); haberDurum = "hazir"; if (tab==="haber" || tab==="detay") render();
}
const ne_zaman = z => { if (!z) return ""; const s = (Date.now()/1000 - z)/60; return s<60 ? `${Math.max(1,Math.round(s))} dk önce` : s<1440 ? `${Math.round(s/60)} saat önce` : s<2880 ? "dün" : `${Math.round(s/1440)} gün önce`; };
const haberSatir = (h, k) => `<a class="hb" href="${esc(h.u)}" target="_blank" rel="noopener noreferrer">${k?`<span class="hb-kod">${esc(k)}</span>`:""}<span class="hb-b">${esc(h.b)}</span><span class="muted hb-alt">${esc(h.k||"")}${h.k?" · ":""}${ne_zaman(h.z)}${h.d==="en"?" · EN":""}</span></a>`;
function haberSayfa(){
  const kodlar = haberKodlari();
  if (haberDurum!=="yukleniyor" && [...kodlar.keys()].some(k=>!haberOnbellek[k] || Date.now()-haberOnbellek[k].t > 20*60000)) haberleriYukle();
  const bas = `<div class="row" style="padding:0 0 6px"><button class="iconbtn" data-tab="ozet" style="margin:0">‹ Özet</button><b>Haberler</b></div>`;
  if (!kodlar.size) return bas + `<div class="card"><p class="muted">Hisse senedi varlığınız ya da izleme listenizde hisse yok.</p></div>`;
  const tum = [];
  for (const [k, tur] of kodlar){ for (const h of haberOnbellek[k]?.d || []) tum.push({...h, kod:k.split(":")[1], tur}); }
  const gor = new Set(), liste = tum.sort((x,y)=>y.z-x.z).filter(h => { const a = h.u; if (gor.has(a)) return false; gor.add(a); return true; })
    .filter(h => haberFiltre==="hepsi" ? true : haberFiltre==="var" ? h.tur==="var" : haberFiltre==="iz" ? h.tur==="iz" : h.kod===haberFiltre);
  const chips = [["hepsi","Tümü"],["var","Varlıklarım"],...([...kodlar.values()].includes("iz")?[["iz","İzleme listem"]]:[]),
    ...[...kodlar.entries()].filter(([,t])=>t==="var").map(([k])=>[k.split(":")[1], k.split(":")[1]])];
  return bas + `<div class="hb-filtre">${chips.map(([k,l])=>`<button data-hbf="${esc(k)}" class="${haberFiltre===k?"on":""}">${esc(l)}</button>`).join("")}</div>
    <div class="card" style="padding:4px 14px">${haberDurum==="yukleniyor" && !tum.length ? `<p class="muted">Yükleniyor…</p>` : liste.length ? liste.slice(0,80).map(h=>haberSatir(h, h.kod)).join("") : `<p class="muted">Son 30 günde haber bulunamadı.</p>`}</div>
    <p class="muted" style="font-size:11px">Kaynak: Google Haberler, son 30 gün; saatte bir yenilenir. Haberler açılınca ilgili sitede okunur.</p>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-hbf]"); if (!b) return; haberFiltre = b.dataset.hbf; render(); window.scrollTo(0,0); }, true);
function detayHaber(a){
  if (!(a.type==="bist"||a.type==="abd") || !a.symbol) return "";
  const k = a.type+":"+String(a.symbol).toUpperCase(), o = haberOnbellek[k];
  if (!o){ haberAl(k).then(()=>{ if (tab==="detay") render(); }); return `<h2>Haberler</h2><div class="card"><p class="muted">Yükleniyor…</p></div>`; }
  return `<h2>Haberler</h2><div class="card" style="padding:4px 14px">${o.d.length ? o.d.slice(0,5).map(h=>haberSatir(h)).join("") : `<p class="muted">Son 30 günde haber yok.</p>`}</div>`;
}

/* ============ BES hesabı (kişi bazında; ekran görüntüsünden yüklenir) ============
   {type:"bes", hesap:true, kisi, sirket, toplam, katki, devlet, tarih, fonlar:[{k, ad, tutar, p0, p0t}]}
   Değer: ekrandaki toplam; fon kodu TEFAS'ta bulunanlar o günden bugüne fon fiyatıyla güncellenir (tahmini). */
function besDeger(a){
  const top = sayi(a.toplam) ?? 0; let sabit = top, est = 0, eslesen = 0;
  for (const f of a.fonlar || []){
    const t = sayi(f.tutar) || 0, c = f.k ? canli?.fon?.[f.k] : null;
    if (c && !f.p0 && c.t && a.tarih && c.t <= a.tarih){ f.p0 = c.p; f.p0t = c.t; }   // ekran günündeki fiyatı sonradan yakala
    if (c && f.p0){ sabit -= t; est += t * c.p / f.p0; eslesen += t; }
  }
  const deger = sabit + est;
  return {deger, ekran: top, fark: deger - top, tahmini: eslesen > 0 && Math.abs(deger - top) >= 1, kapsam: top ? eslesen/top : 0};
}
const besGun = a => a.tarih ? Math.floor((new Date(bugun()) - new Date(a.tarih)) / GUN) : null;
const BES_RENK = ["#e87ba4","#7048e8","#1baf7a","#2a78d6","#eda100","#eb6834","#008300","#868e96","#c2255c","#0c8599"];
function besDetay(a){
  const B = besDeger(a), katki = sayi(a.katki), devlet = sayi(a.devlet) || 0, gun = besGun(a);
  const getiri = katki!=null ? B.ekran - katki - devlet : null, getiriOran = katki ? getiri/(katki+devlet)*100 : null;
  const satir = (k, v, c="") => `<div class="dt-s"><span class="muted">${k}</span><b class="${c}">${v}</b></div>`;
  const F = (a.fonlar||[]).slice().sort((x,y)=>(sayi(y.tutar)||0)-(sayi(x.tutar)||0)), ftop = F.reduce((x,f)=>x+(sayi(f.tutar)||0),0) || 1;
  const fonSatir = (f, i) => { const t = sayi(f.tutar)||0, c = f.k ? canli?.fon?.[f.k] : null, deg = c && f.p0 ? (c.p/f.p0-1)*100 : null, r = BES_RENK[i % BES_RENK.length];
    return `<div class="bes-fon"><div class="bes-fon-ust"><span class="dot" style="background:${r}"></span><span style="flex:1;min-width:0"><b>${esc(f.k||"")}</b> <span class="muted">${esc(String(f.ad||"").replace(/^.*?(A\.Ş\.|ANONİM ŞİRKETİ)\s*/i,"").replace(/ EMEKLİLİK YATIRIM FONU$/i,"") || f.ad || "")}</span></span><b>%${fN2.format(t/ftop*100)}</b></div>
      <div class="bes-cubuk"><span style="width:${(t/ftop*100).toFixed(1)}%;background:${r}"></span></div>
      <div class="muted bes-fon-alt"><span>${gizli?"••••":fTL2n.format(t)}${deg!=null?` · ekrandan beri <span class="${deg>=0?"pos":"neg"}">${yuzde(deg,2)}</span>`:""}</span>${c?`<span>${c.ch!=null?`bugün <span class="${c.ch>=0?"pos":"neg"}">${yuzde(c.ch,2)}</span>`:""}</span>`:""}</div></div>`; };
  return `<div class="row" style="padding:0 0 6px"><button class="iconbtn" data-act="detayGeri" style="margin:0">‹ Geri</button><span class="tag">BES</span></div>
  <div class="card">
    <div style="font-size:20px;font-weight:700">BES · ${esc(a.kisi||"")}</div><div class="muted">${esc([a.sirket, a.plan, a.sozNo].filter(Boolean).join(" · "))}</div>
    <div class="big" style="margin-top:6px">${para(B.deger)}</div>
    ${B.tahmini?`<div class="muted">Ekranda ${para(B.ekran)} · fon fiyatlarıyla bugün tahmini <span class="${B.fark>=0?"pos":"neg"}">${B.fark>=0?"+":"−"}${para(Math.abs(B.fark))}</span></div>`:""}
    ${getiri!=null?`<div class="${getiri>=0?"pos":"neg"}" style="font-weight:600;margin-top:2px">${getiri>=0?"+":"−"}${para(Math.abs(getiri))} getiri (${yuzde(getiriOran,2)})</div>`:""}
  </div>
  <div class="card">
    ${satir("Toplam birikim (ekran)", para(B.ekran))}
    ${katki!=null?satir("Ödenen katkı payı", para(katki)):""}
    ${devlet?satir("Devlet katkısı", para(devlet), "pos"):""}
    ${getiri!=null?satir("Fon getirisi", `${getiri>=0?"+":"−"}${para(Math.abs(getiri))}`, getiri>=0?"pos":"neg"):""}
    ${satir("Son ekran görüntüsü", a.tarih ? `${new Date(a.tarih).toLocaleDateString("tr-TR")}${gun!=null?` · ${gun===0?"bugün":gun+" gün önce"}`:""}` : "—", gun!=null && gun>=7 ? "neg" : "")}
  </div>
  ${F.length?`<h2>Fon dağılımı · ${F.length} fon</h2><div class="card">${F.map(fonSatir).join("")}
    ${B.kapsam?`<p class="muted" style="font-size:11px;margin:8px 0 0">Fon kodları TEFAS'ta bulunanların değeri, ekran tarihinden bu yana fon fiyatındaki değişimle güncellenir (%${fN2.format(B.kapsam*100)}'i). Kesin tutar için haftalık ekran görüntüsü yeterli.</p>`:""}</div>`:""}
  ${gun!=null && gun>=7 ? `<div class="card" style="border-color:var(--neg)"><b>📸 Güncelleme zamanı</b><p class="muted" style="margin:4px 0 0">Bu hesabın son ekranı ${gun} gün önce. Güncel ekran görüntüsünü Claude'a gönderin.</p></div>` : ""}
  <button class="btn" data-edit="${esc(a.id)}">Düzenle</button>
  <button class="btn danger" data-act="detaySil">Sil</button>`;
}

function kivilcim(seri, yon){
  if (!seri || seri.length < 3) return "";
  const mn = Math.min(...seri), mx = Math.max(...seri), rg = (mx-mn) || 1, W=160, H=48;
  const pts = seri.map((v,i)=>[(i/(seri.length-1))*W, H-4-((v-mn)/rg)*(H-10)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const renk = yon<0 ? "var(--neg)" : yon>0 ? "var(--pos)" : "var(--muted)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${W},${H} L0,${H} Z" fill="${renk}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${renk}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".55"/></svg>`;
}
function anlikHesapla(){
  for (const d of piyasaDegerleri()){
    if (d.v==null) continue;
    const o = sonDeger[d.k];
    if (o!=null && o!==d.v) anlik[d.k] = {yon: d.v>o?1:-1, y: (d.v/o-1)*100, t: Date.now()};
    sonDeger[d.k] = d.v;
  }
}
const fTL4 = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",minimumFractionDigits:2,maximumFractionDigits:4});
const fN2 = new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2});
const fN4 = new Intl.NumberFormat("tr-TR",{minimumFractionDigits:4,maximumFractionDigits:4});
const fUSD4 = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"USD",minimumFractionDigits:4,maximumFractionDigits:4});
const fUSD6 = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"USD",maximumFractionDigits:6});
const fTL2n = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",minimumFractionDigits:2,maximumFractionDigits:2});
const fN6tl = {format: v => new Intl.NumberFormat("tr-TR",{maximumFractionDigits:6}).format(v)+" TL"};
const yuzde = (x,ond=2) => (x>0?"+":x<0?"−":"")+"%"+new Intl.NumberFormat("tr-TR",{minimumFractionDigits:ond,maximumFractionDigits:ond}).format(Math.abs(x));

function grafik(){
  const s = S.snapshots.slice(-180);
  if (s.length < 2) return `<p class="muted">Portföy grafiği, uygulamayı birkaç gün açtıkça oluşur.</p>`;
  const vals = s.map(x=>x.t), mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts = s.map((x,i)=>`${(i/(s.length-1)*300).toFixed(1)},${(95-(x.t-mn)/rg*85).toFixed(1)}`).join(" ");
  const fark = vals[vals.length-1]-vals[0];
  return `<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="height:120px"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
  <p class="muted">${esc(s[0].d)} → ${esc(s[s.length-1].d)} · <span class="${fark>=0?"pos":"neg"}">${gizli?"••••":(fark>=0?"+":"")+para(fark)}</span></p>`;
}

/* Dilim grafik: dilime dokununca bilgisi burada görünür; alttaki satırlar detay sayfasına gider */
let pastaSecili = null;
document.addEventListener("click", e => { const d = e.target.closest("[data-dilim]"); if (!d) return; e.stopPropagation(); pastaSecili = pastaSecili===d.dataset.dilim ? null : d.dataset.dilim; render(); }, true);
function pasta(grup, top){
  const dil = PASTA_SIRA.filter(k=>grup[k]>0).map(k=>({k, v:grup[k], o:grup[k]/top}));
  const R=92, r=58, C=100;
  const nokta = (a,rad)=>[C+rad*Math.sin(a), C-rad*Math.cos(a)];
  let a0 = 0, yollar = "";
  for (const d of dil){
    const a1 = a0 + d.o*2*Math.PI;
    if (dil.length===1){
      yollar += `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${renkOf(d.k)}" stroke-width="${R-r}" data-dilim="${d.k}" style="cursor:pointer" opacity="${pastaSecili&&pastaSecili!==d.k?0.3:1}"><title>${TYPES[d.k].ad}</title></circle>`;
    } else {
      const [x0,y0]=nokta(a0,R),[x1,y1]=nokta(a1,R),[x2,y2]=nokta(a1,r),[x3,y3]=nokta(a0,r), b = (a1-a0)>Math.PI?1:0;
      yollar += `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${b} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${x2.toFixed(2)},${y2.toFixed(2)} A${r},${r} 0 ${b} 0 ${x3.toFixed(2)},${y3.toFixed(2)} Z" fill="${renkOf(d.k)}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" data-dilim="${d.k}" style="cursor:pointer" opacity="${pastaSecili&&pastaSecili!==d.k?0.3:1}"><title>${TYPES[d.k].ad} %${(d.o*100).toFixed(1)}</title></path>`;
    }
    a0 = a1;
  }
  const sec = pastaSecili && dil.find(d=>d.k===pastaSecili);
  if (pastaSecili && !sec) pastaSecili = null;
  const st = sec ? toplam(S.assets.filter(a=>a.type===sec.k)) : null;
  const merkez = sec

/* Varlık sıralama: alfabetik / getiri / değer, artan-azalan (cihazda hatırlanır) */
const SIRALAMA = [["deger-","Değer ↓"],["deger+","Değer ↑"],["getiri-","Getiri ↓"],["getiri+","Getiri ↑"],["ad+","A → Z"],["ad-","Z → A"]];

function grupla(l){
  const m = new Map();
  for (const a of l){ const k = grupAnahtar(a); if (!m.has(k)) m.set(k, []); m.get(k).push(a); }

}

    <div style="display:flex;gap:8px"><input name="cost" inputmode="decimal" value="${v("cost")}" style="flex:2" placeholder="${(a.costTip||"toplam")==="birim"?"ör. 52,40":"ör. 250000"}"><select style="flex:1" name="costCur">${["TRY","USD","EUR"].map(c=>`<option value="${c}" ${(a.costCur||"TRY")===c?"selected":""}>${c==="TRY"?"TL":c}</option>`).join("")}</select></div>
    ${(()=>{ const kh = a.id ? kzHesap(a) : null; return kh ? `<p class="${kh.oran>=0?"pos":"neg"}" style="font-size:13px;margin:6px 0 0">Bu maliyetle: ${yuzde(kh.oran,2)} ${kh.oran>=0?"kâr":"zarar"} (${(kh.tutar>=0?"+":"−")+khPara(kh)}). Rakam yanlışsa \"Toplam ödediğim\" ile \"birim fiyat\" seçimini kontrol edin.</p>` : ""; })()}
    <label>Alış tarihi</label><input name="date" type="date" value="${v("date")}">`}

    ${a.id?`<button class="btn danger" type="button" data-act="sil">Sil</button><button class="btn ghost" type="button" data-act="vazgec">Vazgeç</button>`:""}
  </form></div>`;
}
function formOku(){
  const f = document.getElementById("f"); if (!f) return draft;
  const o = {...draft}; for (const el of f.elements) if (el.name && !(el.type==="radio" && !el.checked)) o[el.name] = el.value; return o;
}

document.addEventListener("change", e => {
  if (e.target.form?.id==="f" && e.target.name==="costTip"){ draft = formOku(); render(); return; }
  if (e.target.form?.id==="f" && e.target.name==="besMod"){ const o = formOku(); o.hesap = o.besMod==="hesap"; delete o.besMod; if (o.hesap){ o.konum = "emeklilik"; } draft = o; render(); return; }
  if (e.target.form?.id==="f" && e.target.name==="konum"){ draft = formOku(); render(); return; }
  if (e.target.form?.id==="f" && e.target.name==="type"){ const eskiTip = draft?.type, o = formOku(); if (!o.id && (!o.konum || o.konum===VARSAYILAN_KONUM[eskiTip])) o.konum = VARSAYILAN_KONUM[e.target.value] || o.konum; draft = {...o, type:e.target.value}; render(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id!=="f") return; e.preventDefault();
  const o = formOku();
  delete o.besMod;
  if (o.type==="bes" && o.hesap){
    for (const k of ["toplam","katki","devlet"]) o[k] = sayi(o[k]);
    if (!String(o.kisi||"").trim()) return toast("Kimin hesabı olduğunu yazın");
    if (!o.toplam || o.toplam<=0) return toast("Toplam birikimi girin");
    const eskiH = S.assets.find(a=>a.id===o.id);
    if (eskiH?.fonlar?.length && eskiH.toplam && (eskiH.toplam!==o.toplam || eskiH.tarih!==o.tarih)){   // elle güncelleme: fon tutarlarını orantıla, fiyat tabanını sıfırla
      const oran = o.toplam/eskiH.toplam; o.fonlar = eskiH.fonlar.map(f=>({...f, tutar:(sayi(f.tutar)||0)*oran, p0:null, p0t:null})); }
    Object.assign(o, {kisi:o.kisi.trim(), sirket:String(o.sirket||"").trim(), qty:1, symbol:"", konum:"emeklilik", konumNot:String(o.sirket||"").trim(),
      cost:(o.katki||0)+(o.devlet||0) || null, costTip:"toplam", costCur:"TRY"});
    if (eskiH) Object.assign(eskiH, o); else { o.id = crypto.randomUUID(); S.assets.push(o); }
    draft=null; tab="varlik"; filtre="bes"; render(); window.scrollTo(0,0); await kaydet(); return;
  }
  o.qty = sayi(o.qty); o.cost = sayi(o.cost); if ("manualPrice" in o) o.manualPrice = sayi(o.manualPrice);
  if (o.type==="fon" || o.type==="bes") {
    o.symbol = String(o.symbol||"").trim().toUpperCase();
    const tutarHam = sayi(o.tutar), tkur = kurTL(o.tutarCur||"TRY"); delete o.tutar;
    if (tutarHam && tutarHam > 0 && !tkur) return toast("Kur henüz yüklenmedi, biraz bekleyip tekrar deneyin");
    const tutar = tutarHam ? tutarHam * tkur : null;
    if (tutar && tutar > 0) {
      const cf = canliFiyat(o), mp = o.manualPrice, k = kurTL(o.fiyatCur);
      const birim = cf ? cf.p : (mp && k ? mp*k : null);
      if (birim) o.qty = tutar / birim;
      else { o.qty = 1; o.manualPrice = tutar; o.fiyatCur = "TRY"; }
      o.tutarTarih = bugun();
    }
  }
  if (!o.qty || o.qty<=0) return toast(isBA(o)?"Tutar girin":"Miktar girin");
  if (o.type==="mevduat") {
    if (!String(o.banka||"").trim()) return toast("Banka adını girin");
    if (!o.vade) return toast("Vade sonu tarihini girin");
    o.banka=o.banka.trim(); o.cur ||= "TRY"; o.konum="banka"; o.konumNot=o.hesapNot||""; delete o.cost;
    for (const k of ["oran","stopaj","vadeTutar"]) o[k] = sayi(o[k]);
  }
  if (isBA(o)) { if (!String(o.kisi||"").trim()) return toast("Kişi veya kurum girin"); o.kisi=o.kisi.trim(); o.cur ||= "TRY"; delete o.konum; delete o.cost; }
  if (["kripto","bist","abd","fon","bes"].includes(o.type) && !String(o.symbol||"").trim()) return toast("Sembol / kod girin");
  if (o.symbol) o.symbol = o.symbol.trim().toUpperCase();
  const eski = S.assets.find(a=>a.id===o.id);
  if (o.manualPrice!=null && (!eski || eski.manualPrice!==o.manualPrice)) o.priceDate = bugun();
  if (eski) Object.assign(eski, o); else { o.id = crypto.randomUUID(); S.assets.push(o); }
  draft=null; tab=isBA(o)?"ba":"varlik"; render(); window.scrollTo(0,0);
  await kaydet(); if (o.type==="kripto") fiyatlariAl();
});

function hataMetni(e){

}

/* ============ Kilit ============ */
function kilitle(){
  dinlemeyiBirak(); key=null; anahtarHam=null; S=null; draft=null;
  if (demo){ demo=false; screen="login"; } else screen="unlock";
  render();
}
let sonIslem = Date.now(), gizlendi = 0;
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>sonIslem=Date.now(),{passive:true}));
setInterval(()=>{ if (screen==="app" && Date.now()-sonIslem>KILIT_SURESI) kilitle(); }, 10000);
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden) gizlendi = Date.now();
  else if (screen==="app" && gizlendi && Date.now()-gizlendi>ARKA_PLAN_SURESI) kilitle();
});
setInterval(()=>{ if (screen==="app" && !document.hidden) fiyatlariAl(); }, 60000);

if (CONFIGURED) {
  FB.onAuthStateChanged(auth, async user => {
    if (!user){ uid=null; key=null; S=null; screen="login"; return render(); }
    uid = user.uid; benEmail = (user.email||"").toLowerCase();
    try {
      // Önce: bu kişi başkasının kasasına eklenmiş mi (ör. eş)?
      kasaId = uid; kasaDoc = null;
      const uy = await FB.getDoc(FB.doc(db,"uyelik",benEmail));
      if (uy.exists() && uy.data().kasa && uy.data().kasa !== uid) {
        try {
          const ortak = await FB.getDoc(FB.doc(db,"kasa",uy.data().kasa));
          if (ortak.exists()) { kasaId = ortak.id; kasaDoc = ortak.data(); }
        } catch {}
      }
      if (!kasaDoc) {
        const snap = await FB.getDoc(FB.doc(db,"kasa",uid));
        kasaDoc = snap.exists() ? snap.data() : null;
      }
      screen = kasaDoc ? "unlock" : "setup";
    } catch(e){ screen="login"; render(); const x=document.getElementById("err"); if(x) x.textContent=hataMetni(e); return; }
    render();
  });
}
/* ============ Yeni sürüm kontrolü ============ */
let yeniSurum = null;
async function surumKontrol(){
  try {
    const r = await fetch("version.json?t="+Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const j = await r.json();
    if (j.surum > SURUM && yeniSurum !== j.surum){ yeniSurum = j.surum; surumBandi(j); }
  } catch {}
}
function surumBandi(j){
  document.getElementById("surumBant")?.remove();
  const d = document.createElement("div"); d.id="surumBant";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--acc);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)";
  d.innerHTML = `<div style="flex:1"><b>Yeni sürüm hazır (${esc(j.surum)})</b>${j.not?`<div style="font-size:13px;opacity:.9">${esc(j.not)}</div>`:""}</div><button data-act="guncelle" style="background:#fff;color:#000;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:600">Güncelle</button>`;
  document.body.appendChild(d);
}
surumKontrol();
yenilikleriGoster();
setInterval(surumKontrol, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) surumKontrol(); });

if (CONFIGURED) { FB.getRedirectResult(auth).catch(()=>{}); setTimeout(()=>{ if (screen==="yukleniyor"){ screen="login"; render(); } }, 8000); }
render();
</script>
